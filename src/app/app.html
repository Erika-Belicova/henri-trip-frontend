<header class="topbar">
  <a
    class="brand"
    [routerLink]="authService.isAdmin() ? '/admin' : '/guides'">
    Henri Trip
  </a>

  @if (authService.isAuthenticated()) {
    <nav class="session">

      @if (authService.getCurrentUser()?.role === 'ADMIN') {
        <a routerLink="/admin">Tableau de bord</a>
        <a routerLink="/admin/guides">Gestion des guides</a>
        <a routerLink="/admin/users">Gestion des utilisateurs</a>
      } @else {
        <a routerLink="/guides">Mes guides</a>
      }

      <span class="session-email">
        {{ authService.getCurrentUser()?.email }}
      </span>

      <button
        type="button"
        class="btn-logout"
        (click)="authService.logout()">
        Déconnexion
      </button>

    </nav>
  }
</header>

<main class="page">
  <div class="page-container">
    <router-outlet />
  </div>
</main>
