<header class="topbar">
  <a class="brand" routerLink="/guides">Henri Trip</a>

  @if (authService.isAuthenticated()) {
    <nav class="session">
      <a routerLink="/guides">Guides</a>

      <span class="session-email">
        {{ authService.getCurrentUser()?.email }}
      </span>

      <button
        type="button"
        class="btn-logout"
        (click)="authService.logout()">
        Déconnexion
      </button>
    </nav>
  }
</header>

<main class="page">
  <div class="page-container">
    <router-outlet />
  </div>
</main>
